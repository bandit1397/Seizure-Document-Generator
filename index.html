<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>압수서류 자동작성기</title>
<style>
:root {
  --bg: #eef0f3; --panel: #ffffff; --ink: #1d2330; --muted: #5f6b7a; --line: #d5dae1;
  --accent: #1f4e8c; --accent-ink: #ffffff; --warn-bg: #fff4e0; --warn-ink: #8a5300;
  --ok-bg: #e6f4ea; --ok-ink: #1e6b34; --input: #f8f9fb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; font-size: 14px; }
header.top { background: var(--accent); color: var(--accent-ink); padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
header.top h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
header.top .btns { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 4px; padding: 5px 10px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
header.top button { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.4); }
header.top button:hover { background: rgba(255,255,255,.25); }
button.danger { color: #a02020; }
button.small { padding: 2px 8px; font-size: 12px; }
main { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; gap: 12px; padding: 12px; align-items: start; }
main > * { min-width: 0; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: none; border-radius: 0; background: none; padding: 10px 10px; white-space: nowrap;
  border-bottom: 3px solid transparent; color: var(--muted); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
.tabs .badge { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; margin-left: 4px;
  background: var(--line); color: var(--muted); font-weight: normal; }
.tabs .badge.auto { background: var(--ok-bg); color: var(--ok-ink); }
.tabs .badge.off { background: #eee; color: #999; }
.form { padding: 12px 14px 16px; }
.form h3 { font-size: 14px; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--accent);
  display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.form h3:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 10px; }
.grid.g3 { grid-template-columns: 1fr 1.3fr 2fr; }
.grid .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--input);
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9db7dd; background: #fff; }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.check input { width: auto; }
.item { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #fbfcfd; }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
.sub { font-size: 12px; font-weight: bold; color: var(--muted); margin: 10px 0 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.warns { margin: 0; padding: 0; list-style: none; }
.warns li { background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 6px 10px; margin: 0 0 6px; font-size: 13px; }
.warns li.ok { background: var(--ok-bg); color: var(--ok-ink); }
.preview-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.preview-bar .src { font-size: 12px; color: var(--muted); margin-left: auto; }
.preview { padding: 16px; overflow-x: auto; background: #d9dde3; border-radius: 0 0 6px 6px; }
.status { padding: 8px 12px 0; }

/* ---------- A4 서식 (경찰수사규칙·범죄수사규칙 별지 서식 재현) ---------- */
.page { width: 210mm; min-height: 297mm; margin: 0 auto 16px; background: #fff; color: #000;
  padding: 15mm 17mm 12mm; box-shadow: 0 1px 4px rgba(0,0,0,.25); display: flex; flex-direction: column;
  font-family: "함초롬바탕", "HCR Batang", "바탕", "Batang", "Noto Serif KR", serif; font-size: 11.5pt; line-height: 1.75; }
.page .formno { font-family: "Malgun Gothic", "돋움", sans-serif; font-size: 8.5pt; margin-bottom: 7mm; }
.page h2 { text-align: center; font-size: 17pt; margin: 0 0 6mm; font-weight: bold; letter-spacing: 3px; }
.page table { width: 100%; border-collapse: collapse; }
.page td, .page th { border: 1px solid #000; padding: 1mm 1.5mm; vertical-align: middle; font-weight: normal;
  word-break: keep-all; overflow-wrap: anywhere; text-align: left; }
.page th { text-align: center; }
.page .c { text-align: center; }
.page .r { text-align: right; }
.page .blank { color: #aaa; }
.page .foot { margin-top: auto; padding-top: 1mm; border-top: 1px solid #000; text-align: right; font-size: 7.5pt;
  font-family: "Malgun Gothic", "돋움", sans-serif; }
.page .seal { display: inline-block; margin-left: 3mm; }
.page .small { font-size: 9pt; }
/* 열린 표(좌우 바깥선 없음) */
.page table.open { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; }
.page table.open td, .page table.open th { border: 1px solid #555; }
.page table.open tr > :first-child { border-left: none; }
.page table.open tr > :last-child { border-right: none; }
/* 66호 */
.p66 .lead { border-top: 1.5px solid #000; padding: 2mm 3mm; text-align: justify; margin: 0; line-height: 2; }
.p66 .bar { border-top: 1px solid #555; border-bottom: 1px solid #555; text-align: center; letter-spacing: 9mm; padding: 1mm 0; }
.p66 .narr { flex: 1; min-height: 95mm; padding: 3mm 3mm; white-space: pre-wrap; text-align: justify; line-height: 1.9; }
.p66 .wt td, .p66 .wt th { height: 9.5mm; }
.p66 .when { text-align: center; margin: 4mm 0 1mm; }
.p66 .agency { text-align: center; font-size: 13pt; margin-left: 10%; }
.p66 .signs { text-align: right; padding-right: 6mm; line-height: 2.1; margin-bottom: 4mm; }
/* 67호 */
.p67 h2 { font-size: 18pt; letter-spacing: 8px; margin-bottom: 7mm; }
.p67 table { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; }
.p67 th { background: #fff7c2; }
.p67 td, .p67 th { border-color: #777; font-size: 10.5pt; }
.p67 tr > :first-child { border-left: none; } .p67 tr > :last-child { border-right: none; }
.p67 td.lb { width: 13mm; text-align: center; font-size: 9pt; white-space: nowrap; letter-spacing: -0.5px; }
.p67 td.vl { font-size: 8pt; line-height: 1.25; }
.p67 td { line-height: 1.3; }
.p67 tr.row td { height: 8.6mm; padding-top: .5mm; padding-bottom: .5mm; }
.p67 thead th { white-space: nowrap; padding: 1.5mm .5mm; }
.p67 tbody.it tr:first-child td { border-top: 1.5px solid #000; }
/* 68호 */
.p68 h2 { font-size: 16pt; letter-spacing: 1px; margin: 3mm 0 2mm; }
.p68 .meta { display: flex; justify-content: space-between; padding: 0 2mm; }
.p68 .line { padding: 0 1mm; line-height: 2; }
.p68 .lead { border-top: 1.5px solid #000; margin: 1mm 0 0; padding: 1mm 1mm; text-align: justify; }
.p68 table.open td { height: 8.4mm; }
.p68 .agency { text-align: center; font-size: 13pt; margin: 5mm 0 4mm; }
.p68 .sign { text-align: right; padding-right: 16mm; margin-bottom: 6mm; }
/* 60호·62호 */
.p60 h2, .p62 h2 { font-size: 16pt; letter-spacing: 2px; margin-bottom: 3mm; }
.p62 h2 { letter-spacing: 6px; }
.p60 .sec, .p62 .sec { margin: 0 0 1mm; }
.p60 .who td, .p62 .who td { height: 9mm; }
.p60 .who td.lb, .p62 .who td.lb { width: 22mm; text-align: center; letter-spacing: 4mm; }
.p60 .who td.lb2, .p62 .who td.lb2 { width: 25mm; text-align: center; font-size: 9.5pt; white-space: nowrap; }
.p60 .stmt, .p62 .stmt { margin: 5mm 1mm 3mm; text-align: justify; line-height: 1.9; }
.p60 .when, .p62 .when { text-align: center; margin: 2mm 0; }
.p60 .by, .p62 .by { text-align: right; padding-right: 8mm; margin: 2mm 0 5mm; letter-spacing: 1.5mm; }
.p60 .tb td, .p62 .tb td { height: 9.6mm; }
.p60 .to, .p62 .to { text-align: center; font-size: 15pt; margin: 9mm 0 6mm; }
.p60 .to b, .p62 .to b { letter-spacing: 1mm; }
.page.void { position: relative; justify-content: center; }
.page.void p { text-align: center; color: #666; }

@media screen and (max-width: 1500px) { .preview .page { zoom: .8; } }
@media screen and (max-width: 1250px) { .preview .page { zoom: .65; } }

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  header.top, .panel.inputs, .tabs, .preview-bar, .status { display: none !important; }
  main { display: block; padding: 0; }
  .panel { border: none; }
  .preview { padding: 0; background: #fff; }
  .page { margin: 0; box-shadow: none; min-height: 296mm; page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page.void { display: none; }
  .page .blank { color: transparent; }
  .p67 th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- 인터넷 익스플로러 10·11 전용 (다른 브라우저는 이 블록을 읽지 않는다) ----------
   IE는 CSS 변수(var), grid, flex의 gap을 모르므로 같은 모양을 실제 색값·flex·여백으로 다시 적는다. */
@media all and (-ms-high-contrast: none), (-ms-high-contrast: active) {
  body { background: #eef0f3; color: #1d2330; }
  header.top { background: #1f4e8c; color: #ffffff; }

  header.top .btns > * { margin: 3px 6px 3px 0; }

  .panel { background: #ffffff; border: 1px solid #d5dae1; }
  .tabs { border-bottom: 1px solid #d5dae1; }
  .tabs button { color: #5f6b7a; }
  .tabs button.on { color: #1f4e8c; border-bottom-color: #1f4e8c; }
  .tabs .badge { background: #d5dae1; color: #5f6b7a; }
  .tabs .badge.auto { background: #e6f4ea; color: #1e6b34; }
  .form h3 { border-bottom: 1px solid #d5dae1; color: #1f4e8c; }
  .form h3 button { margin-left: 6px; }
  .grid { display: flex; flex-wrap: wrap; margin: 0 -5px -8px; }
  .grid > * { width: 50%; padding: 0 5px; margin-bottom: 8px; }
  .grid > .full { width: 100%; }
  .grid.g3 > * { width: 23.26%; }
  .grid.g3 > :nth-child(2) { width: 30.23%; }
  .grid.g3 > :nth-child(3) { width: 46.51%; }
  label.f { color: #5f6b7a; }
  label.f > input, label.f > select, label.f > textarea { margin-top: 3px; }
  input, select, textarea { color: #1d2330; background: #f8f9fb; border: 1px solid #d5dae1; }

  .preview-bar { border-bottom: 1px solid #d5dae1; }
  .preview-bar > * { margin: 3px 6px 3px 0; }
  .preview-bar .src { color: #5f6b7a; margin-left: auto; }
}
@media all and (-ms-high-contrast: none) and (max-width: 1000px), (-ms-high-contrast: active) and (max-width: 1000px) {
  main { display: block; }

</style>

<body>
<header class="top">
  <h1>압수서류 자동작성기 <small style="font-weight:normal;opacity:.8">— 압수조서·압수목록 입력 → 교부서·임의제출·소유권 포기서 자동 작성</small></h1>
  <div class="btns">
    <button id="btnNew">새 사건</button>
    <button id="btnSample">예시 불러오기</button>
    <button id="btnSaveJson">사건 저장(.json)</button>
    <button id="btnLoadJson">사건 열기</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <!-- 입력 -->
  <section class="panel inputs">
    <div class="tabs" id="inTabs">
      <button data-in="jo" class="on">① 압수조서 입력</button>
      <button data-in="mok">② 압수목록 입력</button>
    </div>

    <div class="form" id="in-jo">
      <h3>사건·관서</h3>
      <div class="grid">
        <label class="f">소속관서<input data-k="jo.agency" placeholder="예: 서울양천경찰서"></label>
        <label class="f">소속관서장(수신)<input data-k="jo.chief" placeholder="비우면 '소속관서+장'"></label>
        <label class="f">피의자 성명<input data-k="jo.suspect"></label>
        <label class="f">외 ○명<input type="number" min="0" data-k="jo.suspectOthers" placeholder="0"></label>
        <label class="f">죄명<input data-k="jo.crime" placeholder="예: 절도"></label>
        <label class="f">사건 구분
          <select data-k="jo.caseType"><option value="피의">피의사건</option><option value="혐의">혐의사건(입건 전)</option></select></label>
        <label class="f">사건번호<input data-k="jo.caseNo" placeholder="예: 2026-001234"></label>
        <label class="f">교부서 문서번호(제 ○ 호)<input data-k="jo.docNo" placeholder="예: 2026-00123"></label>
        <label class="f">압수번호<input data-k="jo.seizureNo"></label>
        <label class="f">접수번호<input data-k="jo.receiptNo"></label>
      </div>

      <h3>압수 일시·장소·근거</h3>
      <div class="grid">
        <label class="f">압수일시<input type="datetime-local" data-k="jo.datetime" placeholder="예: 2026-10-12 12:00"></label>
        <label class="f">압수 근거
          <select data-k="jo.method">
            <option value="임의제출">임의제출 (형사소송법 제218조)</option>
            <option value="유류물">유류물 (형사소송법 제218조)</option>
            <option value="영장">압수·수색영장 (형사소송법 제215조)</option>
            <option value="현행범체포현장">체포현장 (형사소송법 제216조)</option>
            <option value="긴급압수">범죄장소 긴급압수 (형사소송법 제216조 제3항)</option>
          </select>
        </label>
        <label class="f full">압수장소<input data-k="jo.place" placeholder="예: 서울 양천구 목동서로 130 앞 노상"></label>
      </div>

      <h3>압수자·참여 경찰관</h3>
      <div class="grid">
        <label class="f">압수자 계급<select data-k="jo.officer.rank"></select></label>
        <label class="f">압수자 성명<input data-k="jo.officer.name"></label>
        <label class="f">참여 경찰관 계급<select data-k="jo.part.rank"></select></label>
        <label class="f">참여 경찰관 성명<input data-k="jo.part.name"></label>
      </div>

      <h3>압수 경위</h3>
      <textarea data-k="jo.narrative" rows="9" placeholder="압수 경위를 작성하세요. [경위 초안 만들기]를 누르면 입력한 내용으로 초안이 들어갑니다."></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center">
        <button id="btnDraft">경위 초안 만들기</button>
        <span class="hint">초안은 반드시 실제 경위에 맞게 고쳐 쓰세요.</span>
      </div>

      <h3>참여인 (압수조서 하단 표) <button class="small" id="btnWitFill">압수목록 소지자로 채우기</button></h3>
      <div id="witnesses"></div>

      <h3>작성</h3>
      <div class="grid">
        <label class="f">작성일<input type="date" data-k="jo.writeDate" placeholder="예: 2026-10-12"></label>
      </div>
    </div>

    <div class="form" id="in-mok" hidden>
      <p class="hint" style="margin-top:0">압수물마다 소지자(제출자)와 소유자를 입력합니다. 이 내용이 압수목록 교부서·임의제출·소유권 포기서에 그대로 들어갑니다.</p>
      <div id="items"></div>
      <button class="primary" id="btnAddItem">+ 압수물 추가</button>
      <datalist id="disposalList">
        <option value="반환 희망"><option value="가환부 희망"><option value="반환 불요(소유권 포기)"><option value="폐기 동의">
      </datalist>
    </div>
  </section>

  <!-- 미리보기 -->
  <section class="panel">
    <div class="tabs" id="outTabs"></div>
    <div class="status"><ul class="warns" id="warns"></ul></div>
    <div class="preview-bar">
      <button class="primary" id="btnPrint">이 서류 인쇄</button>
      <button id="btnPrintAll">전체 인쇄</button>
      <button id="btnHwp">이 서류 HWP 저장</button>
      <button id="btnHwpAll">전체 HWP 저장</button>
      <span class="hint" id="hwpStatus"></span>
      <span class="src" id="srcNote"></span>
    </div>
    <div class="preview" id="preview"></div>
  </section>
</main>

<script src="compat.js"></script>
<script src="pako.es5.min.js"></script>
<script src="case.js"></script>
<script src="hwp-fill.js"></script>
<script src="hwp-templates.js"></script>
<script src="hwp-forms.js"></script>
<script>
(function () {
  "use strict";

  var RANKS = ["순경", "경장", "경사", "경위", "경감", "경정", "총경"];
  var STORE_KEY = "seizure-docs-v2";

  function blankPerson() { return { name: "", rrn: "", job: "", phone: "", addr: "" }; }
  function blankWitness() { return { name: "", rrn: "", addr: "" }; }
  function blankItem() {
    return { name: "", qty: "", feature: "", holder: blankPerson(), ownerSame: true, owner: blankPerson(),
      opinion: "", note: "", disposal: "", waive: false, waiveConfirmed: false };
  }
  function todayStr() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function blankState() {
    return {
      jo: {
        agency: "", chief: "", suspect: "", suspectOthers: "", crime: "", caseType: "피의",
        caseNo: "", docNo: "", seizureNo: "", receiptNo: "",
        datetime: "", place: "", method: "임의제출",
        officer: { rank: "경위", name: "" }, part: { rank: "경사", name: "" },
        narrative: "", witnesses: [blankWitness(), blankWitness(), blankWitness()], writeDate: todayStr()
      },
      items: [blankItem()]
    };
  }
  function sampleState() {

  }

  var DOCS = [
    { id: "jo", name: "압수조서", kind: "직접", src: "경찰수사규칙 별지 제66호서식", render: docJo },
    { id: "mok", name: "압수목록", kind: "직접", src: "경찰수사규칙 별지 제67호서식", render: docMok },
    { id: "gyobu", name: "압수목록 교부서", kind: "자동", src: "경찰수사규칙 별지 제68호서식", render: docGyobu },
    { id: "imui", name: "임의제출", kind: "자동", src: "범죄수사규칙 별지 제62호서식", render: docImui },
    { id: "pogi", name: "소유권 포기서", kind: "자동", src: "범죄수사규칙 별지 제60호서식", render: docPogi }
  ];

  // ---------- 검증 ----------
  function warnings() {
    var w = [], jo = state.jo, items = filledItems();
    if (!jo.agency) w.push("압수조서: 소속관서가 비어 있습니다.");
    if (!jo.suspect) w.push("압수조서: 피의자 성명이 비어 있습니다.");
    if (!jo.crime) w.push("압수조서: 죄명이 비어 있습니다.");
    if (!jo.datetime) w.push("압수조서: 압수일시가 비어 있습니다.");
    if (!jo.place) w.push("압수조서: 압수장소가 비어 있습니다.");
    if (!jo.officer.name) w.push("압수조서: 압수자 성명이 비어 있습니다.");
    if (!jo.part.name) w.push("압수조서: 참여 경찰관 성명이 비어 있습니다.");
    if (title(jo.officer.rank) !== "사법경찰관") w.push("압수조서 서식상 압수자는 사법경찰관(경위 이상)입니다. 압수자 계급을 확인하세요.");
    if (!items.length) w.push("압수목록: 압수물(품종)이 하나도 없습니다.");
    items.forEach(function (it, i) {
      var n = "압수물 " + (i + 1) + "(" + it.name + ")";
      if (!it.qty) w.push(n + ": 수량이 비어 있습니다.");
      if (!it.holder.name) w.push(n + ": 소지자(제출자) 성명이 비어 있습니다.");
      if (it.waive) {
        var o = ownerOf(it);
        if (!o.name) w.push(n + ": 소유권 포기로 표시했으나 소유자 성명이 없습니다.");
        if (!it.waiveConfirmed) w.push(n + ": 소유권 포기 의사를 소유자 본인에게 확인했는지 체크하세요.");
        if (it.ownerSame && /절도|장물|강도|사기|횡령|점유이탈/.test(jo.crime)) {
          w.push(n + ": 죄명이 '" + jo.crime + "'인데 소지자를 소유자로 보고 소유권 포기서를 만들고 있습니다. 피해품이면 소유자는 피해자입니다.");
        }
      }
    });
    return w;
  }

  // ---------- 화면 ----------
  function renderOutTabs() {
    var imuiOff = state.jo.method !== "임의제출";
    var pogiOff = !filledItems().some(function (it) { return it.waive; });
    document.getElementById("outTabs").innerHTML = DOCS.map(function (d) {
      var off = (d.id === "imui" && imuiOff) || (d.id === "pogi" && pogiOff);
      var badge = off ? '<span class="badge off">해당없음</span>' : d.kind === "자동" ? '<span class="badge auto">자동</span>' : '<span class="badge">직접</span>';
      return '<button data-doc="' + d.id + '"' + (d.id === currentDoc ? ' class="on"' : "") + ">" + d.name + badge + "</button>";
    }).join("");
  }
  function currentDef() { return DOCS.filter(function (x) { return x.id === currentDoc; })[0]; }
  function renderPreview() {
    var d = currentDef();
    document.getElementById("preview").innerHTML = d.render();
    document.getElementById("srcNote").textContent = "서식: " + d.src;
    var w = warnings();
    document.getElementById("warns").innerHTML = w.length
      ? w.map(function (x) { return "<li>⚠ " + esc(x) + "</li>"; }).join("")
      : '<li class="ok">✓ 필수 항목이 모두 입력되었습니다.</li>';
  }
  function refresh() { persist(); renderOutTabs(); renderPreview(); }

  function bindStatic() {
    document.querySelectorAll("select[data-k$='.rank']").forEach(function (s) {
      s.innerHTML = RANKS.map(function (r) { return "<option>" + r + "</option>"; }).join("");
    });
    document.querySelectorAll("#in-jo [data-k]").forEach(function (el) {
      el.addEventListener("input", function () { setPath(state, el.dataset.k, fieldValue(el)); refresh(); });
      // IE는 선택 목록(계급 등)을 바꿀 때 input 이벤트를 보내지 않는다. 값이 그대로면 아무것도 하지 않는다.
      el.addEventListener("change", function () {
        var val = fieldValue(el);
        if (getPath(state, el.dataset.k) !== val) { setPath(state, el.dataset.k, val); refresh(); }
      });
    });
  }
  // 날짜 입력칸이 없는 브라우저(IE)에서는 일반 글자칸이 되므로 "2026-10-12 12:00"도 받아 들인다
  function fieldValue(el) {
    if (el.dataset.k === "jo.datetime" && el.type !== "datetime-local") {
      return el.value.trim().replace(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})$/, "$1T$2");
    }
    return el.value;
  }
  function fillStatic() {
    document.querySelectorAll("#in-jo [data-k]").forEach(function (el) {
      var val = getPath(state, el.dataset.k); el.value = val == null ? "" : val;
      if (el.dataset.k === "jo.datetime" && el.type !== "datetime-local") el.value = el.value.replace("T", " ");
    });
    renderWitnesses();
  }
  function renderWitnesses() {
    document.getElementById("witnesses").innerHTML = state.jo.witnesses.map(function (w, i) {
      return '<div class="grid g3" style="margin-bottom:6px">' +
        '<label class="f">성명<input data-w="' + i + '" data-p="name" value="' + esc(w.name) + '"></label>' +
        '<label class="f">주민등록번호<input data-w="' + i + '" data-p="rrn" value="' + esc(w.rrn) + '"></label>' +
        '<label class="f">주소<input data-w="' + i + '" data-p="addr" value="' + esc(w.addr) + '"></label></div>';
    }).join("");
  }

  function personFields(prefix, p, i) {
    var f = function (k, label, cls) {
      return '<label class="f' + (cls ? " " + cls : "") + '">' + label + '<input data-i="' + i + '" data-p="' + prefix + "." + k + '" value="' + esc(p[k]) + '"></label>';
    };
    return '<div class="grid">' + f("name", "성명") + f("rrn", "주민등록번호") + f("job", "직업") + f("phone", "전화번호(연락처)") + f("addr", "주소(주거)", "full") + "</div>";
  }
  function renderItems() {
    document.getElementById("items").innerHTML = state.items.map(function (it, i) {
      var inp = function (k, label, ph, cls, extra) {
        return '<label class="f' + (cls ? " " + cls : "") + '">' + label + '<input data-i="' + i + '" data-p="' + k + '" value="' + esc(it[k]) + '" placeholder="' + (ph || "") + '"' + (extra || "") + "></label>";
      };
      return '<div class="item">' +
        '<div class="item-head"><span>압수물 ' + (i + 1) + '</span><span style="display:flex;gap:4px">' +
        (i > 0 ? '<button class="small" data-act="copy" data-i="' + i + '">↑ 인적사항 복사</button>' : "") +
        (state.items.length > 1 ? '<button class="small danger" data-act="del" data-i="' + i + '">삭제</button>' : "") + "</span></div>" +
        '<div class="grid">' + inp("name", "품종", "예: 자전거") + inp("qty", "수량", "예: 1대") +
        inp("feature", "특징(색상·제조사·일련번호 등)", "", "full") +
        inp("opinion", "경찰의견", "예: 피해자 환부") + inp("note", "비고", "예: 임의제출") + "</div>" +
        '<div class="sub">소지자 또는 제출자</div>' + personFields("holder", it.holder, i) +
        '<div class="sub">소유자</div>' +
        '<label class="check"><input type="checkbox" data-i="' + i + '" data-p="ownerSame"' + (it.ownerSame ? " checked" : "") + "> 소지자와 동일인</label>" +
        (it.ownerSame ? "" : personFields("owner", it.owner, i)) +
        '<div class="sub">처분 (임의제출·소유권 포기서)</div>' +
        '<div class="grid">' + inp("disposal", "제출자의 처분의견(반환의사 유무)", "제출자가 밝힌 의견", "full", ' list="disposalList"') + "</div>" +
        '<label class="check" style="margin-top:6px"><input type="checkbox" data-i="' + i + '" data-p="waive"' + (it.waive ? " checked" : "") + "> 소유자가 소유권을 포기함 → 소유권 포기서 작성</label>" +
        (it.waive ? '<label class="check" style="margin-top:4px"><input type="checkbox" data-i="' + i + '" data-p="waiveConfirmed"' + (it.waiveConfirmed ? " checked" : "") + "> 소유자 본인에게 포기 의사를 직접 확인함</label>" : "") +
        "</div>";
    }).join("");
  }
  function onItemInput(e) {
    var el = e.target; if (el.dataset.i == null || !el.dataset.p) return;
    var it = state.items[+el.dataset.i];
    setPath(it, el.dataset.p, el.type === "checkbox" ? el.checked : el.value);
    if (el.type === "checkbox") renderItems();
    refresh();
  }

  function switchIn(tab) {
    document.querySelectorAll("#inTabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.in === tab); });
    document.getElementById("in-jo").hidden = tab !== "jo";
    document.getElementById("in-mok").hidden = tab !== "mok";
    currentDoc = tab; refresh();
  }

  // ---------- 출력 ----------
  function printDocs(ids) {
    var prev = document.getElementById("preview"), keep = prev.innerHTML;
    prev.innerHTML = DOCS.filter(function (d) { return ids.indexOf(d.id) >= 0; }).map(function (d) { return d.render(); }).join("");
    window.print();
    prev.innerHTML = keep;
  }
  function download(name, content, type) {
    var blob = new Blob(typeof content === "string" ? ["﻿", content] : [content], { type: type });
    // IE는 <a download>를 모르므로 IE 전용 저장 기능을 쓴다
    if (!("download" in document.createElement("a")) && window.navigator.msSaveOrOpenBlob) {
      window.navigator.msSaveOrOpenBlob(blob, name); return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- HWP 저장: 서식원본(HWP)의 칸에 값을 채워 그대로 .hwp로 내려받는다 ----------
  function streamBytes(u8, transform) {
    return new Response(new Blob([u8]).stream().pipeThrough(transform)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  var nativeCodec = {
    inflateRaw: function (u8) { return streamBytes(u8, new DecompressionStream("deflate-raw")); },
    deflateRaw: function (u8) { return streamBytes(u8, new CompressionStream("deflate-raw")); }
  };
  // 브라우저에 압축 기능이 없으면(IE, Chrome·Edge 103 이전) 함께 들어 있는 pako(pako.es5.min.js)로 압축한다
  var pakoCodec = {
    inflateRaw: function (u8) {
      var out = window.pako.inflateRaw(u8);
      if (!out) throw new Error("압축을 풀지 못했습니다.");
      return out;
    },
    deflateRaw: function (u8) { return window.pako.deflateRaw(u8); }
  };
  function nativeSupported() {
    try { new CompressionStream("deflate-raw"); new DecompressionStream("deflate-raw"); return true; } catch (e) { return false; }
  }
  var hwpCodec = nativeSupported() ? nativeCodec : pakoCodec;
  function hwpSupported() { return hwpCodec === nativeCodec || !!window.pako; }
  function templateBytes(id) {
    var bin = atob(window.HWP_TEMPLATES[id]), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  function setHwpStatus(msg) { document.getElementById("hwpStatus").textContent = msg; }
  function saveHwp(ids) {
    if (!hwpSupported()) { alert("이 브라우저는 HWP 저장을 지원하지 않습니다. 최신 Chrome 또는 Edge에서 열어 주세요."); return; }
    var files = window.HwpForms.plan(state, ids, fileBase());
    if (!files.length) { alert("작성 대상인 서류가 없습니다. (임의제출·소유권 포기서는 조건에 맞을 때만 만들어집니다)"); return; }
    setHwpStatus("HWP 만드는 중…");
    var done = 0;
    files.reduce(function (chain, f) {
      return chain.then(function () {
        return window.HwpFill.fill(templateBytes(f.template), f.edits, hwpCodec);
      }).then(function (bytes) {
        download(f.fileName, bytes, "application/x-hwp");
        done++;
        return new Promise(function (r) { setTimeout(r, 350); });   // 여러 파일을 연달아 받을 때 브라우저가 놓치지 않게
      });
    }, Promise.resolve()).then(function () {
      setHwpStatus("HWP " + done + "개 저장됨 (다운로드 폴더)");
    }).catch(function (err) {
      setHwpStatus("");
      alert("HWP를 만들지 못했습니다: " + err.message);
    });
  }
  function fileBase() {
    var jo = state.jo, d = (jo.datetime || jo.writeDate || "").slice(0, 10).replace(/-/g, "");
    return [d, jo.suspect].filter(Boolean).join("_") || "압수서류";
  }

  // ---------- 이벤트 ----------
  document.getElementById("inTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) switchIn(b.dataset.in);
  });
  document.getElementById("outTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    currentDoc = b.dataset.doc; refresh();
  });
  document.getElementById("witnesses").addEventListener("input", function (e) {
    var el = e.target; if (el.dataset.w == null) return;
    state.jo.witnesses[+el.dataset.w][el.dataset.p] = el.value; refresh();
  });
  document.getElementById("btnWitFill").addEventListener("click", function () {
    var seen = {}, list = [];
    filledItems().forEach(function (it) {
      var k = personKey(it.holder);
      if (it.holder.name && !seen[k]) { seen[k] = 1; list.push({ name: it.holder.name, rrn: it.holder.rrn, addr: it.holder.addr }); }
    });
    if (!list.length) { alert("압수목록에 소지자(제출자)가 입력되어 있지 않습니다."); return; }
    state.jo.witnesses = [0, 1, 2].map(function (i) { return list[i] || blankWitness(); });
    renderWitnesses(); refresh();
  });
  var itemsBox = document.getElementById("items");
  itemsBox.addEventListener("input", function (e) {
    onItemInput(e);
    // 처분의견에 '포기'를 적으면 소유권 포기서 작성 체크를 켠다
    if (e.target.dataset.p === "disposal" && isWaiver(e.target.value)) {
      var it = state.items[+e.target.dataset.i];
      if (!it.waive) { it.waive = true; renderItems(); refresh(); }
    }
  });
  itemsBox.addEventListener("change", function (e) { if (e.target.type === "checkbox") onItemInput(e); });
  itemsBox.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var i = +b.dataset.i;
    if (b.dataset.act === "del") state.items.splice(i, 1);
    if (b.dataset.act === "copy") {
      var prev = state.items[i - 1];
      state.items[i].holder = Object.assign({}, prev.holder);
      state.items[i].owner = Object.assign({}, prev.owner);
      state.items[i].ownerSame = prev.ownerSame;
    }
    renderItems(); refresh();
  });
  document.getElementById("btnAddItem").addEventListener("click", function () {
    var it = blankItem(), last = state.items[state.items.length - 1];
    if (last) {
      it.holder = Object.assign({}, last.holder); it.owner = Object.assign({}, last.owner);
      it.ownerSame = last.ownerSame; it.note = last.note;
    }
    state.items.push(it); renderItems(); refresh();
  });
  document.getElementById("btnDraft").addEventListener("click", function () {
    var ta = document.querySelector("[data-k='jo.narrative']");
    if (ta.value.trim() && !confirm("현재 작성된 압수 경위를 초안으로 바꿀까요?")) return;
    state.jo.narrative = draftNarrative(); ta.value = state.jo.narrative; refresh();
  });
  document.getElementById("btnNew").addEventListener("click", function () {
    if (!confirm("입력한 내용을 모두 지우고 새 사건을 시작할까요?\n(필요하면 먼저 [사건 저장]을 누르세요)")) return;
    var keep = state.jo; state = blankState();
    state.jo.agency = keep.agency; state.jo.chief = keep.chief;
    state.jo.officer = Object.assign({}, keep.officer); state.jo.part = Object.assign({}, keep.part);
    fillStatic(); renderItems(); switchIn("jo");
  });
  document.getElementById("btnSample").addEventListener("click", function () {
    if (!confirm("예시 사건(자전거 절도·임의제출)을 불러옵니다. 현재 입력 내용은 지워집니다.")) return;
    state = sampleState(); fillStatic(); renderItems(); switchIn("jo");
  });
  document.getElementById("btnSaveJson").addEventListener("click", function () {
    download(fileBase() + ".json", JSON.stringify(state, null, 2), "application/json");
  });
  document.getElementById("btnLoadJson").addEventListener("click", function () { document.getElementById("fileJson").click(); });
  document.getElementById("fileJson").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { state = normalize(JSON.parse(String(r.result).replace(/^﻿/, ""))); fillStatic(); renderItems(); switchIn("jo"); }
      catch (err) { alert("사건 파일을 읽을 수 없습니다."); }
    };
    r.readAsText(f, "utf-8"); e.target.value = "";
  });
  document.getElementById("btnPrint").addEventListener("click", function () { printDocs([currentDoc]); });
  document.getElementById("btnPrintAll").addEventListener("click", function () { printDocs(DOCS.map(function (d) { return d.id; })); });
  document.getElementById("btnHwp").addEventListener("click", function () { saveHwp([currentDoc]); });
  document.getElementById("btnHwpAll").addEventListener("click", function () { saveHwp(DOCS.map(function (d) { return d.id; })); });

  bindStatic(); fillStatic(); renderItems(); refresh();
})();
</script>
</body>
</html>
